<div style="max-width: 900px; margin: 40px auto; padding: 20px;">
  <header style="text-align: center; margin-bottom: 50px;">
    <h1 style="color: #001F3F; font-size: 2.5rem;">Welcome to the Community Help Desk Portal</h1>
    <p style="color: #555; font-size: 1.2rem;">Your hub for assistance and updates.</p>
  </header>

  <section>
    <h2 style="border-bottom: 2px solid #001F3F; padding-bottom: 10px; color: #001F3F;">Latest Updates</h2>
    @if (latestUpdates$ | async; as posts) {
      @for (post of posts; track post.id) {
        <div style="padding: 15px; margin-bottom: 15px; background: #fdfdf5; border-left: 4px solid #001F3F;">
          <h3 style="margin: 0; color: #001F3F;">{{ post.title | uppercase }}</h3>
          <p style="color: #666;">{{ post.body | truncate:120 }}</p>
          <small style="color: #999;">Posted: February 2026</small>
        </div>
      }
    }
  </section>
</div>
